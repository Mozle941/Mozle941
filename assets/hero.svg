<g class="fu" style="animation-delay:1.4s"><text class="lbl" x="245" y="232" font-size="9">STARS</text><text x="245" y="266" font-size="30" font-weight="700" fill="#e6edf3">2</text><rect class="pl" x="395" y="228" width="4" height="4" fill="#4f7cff" style="animation-delay:0.4s"/></g>
<g class="fu" style="animation-delay:1.6s"><text class="lbl" x="450" y="232" font-size="9">CONTRIBUTIONS</text><text x="450" y="266" font-size="30" font-weight="700" fill="#e6edf3">35</text><rect class="pl" x="600" y="228" width="4" height="4" fill="#4f7cff" style="animation-delay:0.8s"/></g>
<g class="fu" style="animation-delay:1.8s"><text class="lbl" x="655" y="232" font-size="9">FOLLOWERS</text><text x="655" y="266" font-size="30" font-weight="700" fill="#e6edf3">1</text><rect class="pl" x="805" y="228" width="4" height="4" fill="#4f7cff" style="animation-delay:1.2000000000000002s"/></g>
