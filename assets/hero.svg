<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" fill="none" role="img" aria-label="Profile banner: Mos_dev, backend or systems engineer">
<defs><clipPath id="card"><rect x="1" y="1" width="898" height="298" rx="18"/></clipPath></defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace} .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.lbl{font-size:10px;letter-spacing:2.5px;fill:#6f7fa6}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.fu{opacity:0;animation:fadeUp .8s ease-out forwards}
.sp{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.spr{transform-box:fill-box;transform-origin:center;animation:spinr 36s linear infinite}
.pl{animation:pulse 2.4s ease-in-out infinite}
.fl{stroke-dasharray:2 8;animation:flow 2s linear infinite}
.gr{transform-box:fill-box;transform-origin:left center;animation:grow 1.4s ease-out forwards}

</style>
<rect x=".5" y=".5" width="899" height="299" rx="18" fill="#050a14" stroke="#18203a"/>
<g clip-path="url(#card)"><g stroke="#0e1730" stroke-width="1"><animateTransform attributeName="transform" type="translate" from="0 0" to="30 30" dur="6s" repeatCount="indefinite"/><path d="M-30 -30V330"/><path d="M0 -30V330"/><path d="M30 -30V330"/><path d="M60 -30V330"/><path d="M90 -30V330"/><path d="M120 -30V330"/><path d="M150 -30V330"/><path d="M180 -30V330"/><path d="M210 -30V330"/><path d="M240 -30V330"/><path d="M270 -30V330"/><path d="M300 -30V330"/><path d="M330 -30V330"/><path d="M360 -30V330"/><path d="M390 -30V330"/><path d="M420 -30V330"/><path d="M450 -30V330"/><path d="M480 -30V330"/><path d="M510 -30V330"/><path d="M540 -30V330"/><path d="M570 -30V330"/><path d="M600 -30V330"/><path d="M630 -30V330"/><path d="M660 -30V330"/><path d="M690 -30V330"/><path d="M720 -30V330"/><path d="M750 -30V330"/><path d="M780 -30V330"/><path d="M810 -30V330"/><path d="M840 -30V330"/><path d="M870 -30V330"/><path d="M900 -30V330"/><path d="M930 -30V330"/><path d="M-30 -30H930"/><path d="M-30 0H930"/><path d="M-30 30H930"/><path d="M-30 60H930"/><path d="M-30 90H930"/><path d="M-30 120H930"/><path d="M-30 150H930"/><path d="M-30 180H930"/><path d="M-30 210H930"/><path d="M-30 240H930"/><path d="M-30 270H930"/><path d="M-30 300H930"/><path d="M-30 330H930"/></g></g>
<defs><radialGradient id="glow" cx="80%" cy="30%" r="45%"><stop offset="0" stop-color="#4f7cff" stop-opacity=".28"/><stop offset="1" stop-color="#4f7cff" stop-opacity="0"/></radialGradient>
<clipPath id="tw"><rect x="40" y="128" width="0" height="30"><animate attributeName="width" from="0" to="420" dur="2s" begin=".4s" fill="freeze"/></rect></clipPath></defs>
<rect x="1" y="1" width="898" height="298" rx="18" fill="url(#glow)"/>
<g stroke-width="1.2" fill="none">
 <g class="sp" style="transform-origin:740px 100px"><circle cx="740" cy="100" r="62" stroke="#4f7cff" stroke-opacity=".5" stroke-dasharray="3 7"/><circle cx="802" cy="100" r="4" fill="#7aa2ff"/></g>
 <g class="spr" style="transform-origin:740px 100px"><circle cx="740" cy="100" r="98" stroke="#ff4d6d" stroke-opacity=".35" stroke-dasharray="40 14 4 14"/><circle cx="740" cy="2" r="3" fill="#ff4d6d"/></g>
 <circle cx="740" cy="100" r="134" stroke="#4f7cff" stroke-opacity=".15"/>
 <circle cx="740" cy="100" r="22" fill="#0d1a3a" stroke="#4f7cff"/><circle class="pl" cx="740" cy="100" r="6" fill="#7aa2ff"/>
</g>
