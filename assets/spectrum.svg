<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" fill="none" role="img" aria-label="Technology spectrum by primary language of public repos">
<defs><clipPath id="card"><rect x="1" y="1" width="898" height="248" rx="18"/></clipPath></defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace} .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.lbl{font-size:10px;letter-spacing:2.5px;fill:#6f7fa6}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.fu{opacity:0;animation:fadeUp .8s ease-out forwards}
.sp{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.spr{transform-box:fill-box;transform-origin:center;animation:spinr 36s linear infinite}
.pl{animation:pulse 2.4s ease-in-out infinite}
.fl{stroke-dasharray:2 8;animation:flow 2s linear infinite}
.gr{transform-box:fill-box;transform-origin:left center;animation:grow 1.4s ease-out forwards}
@keyframes cyc{0%{opacity:0}2%{opacity:1}23.00%{opacity:1}25.00%{opacity:0}100%{opacity:0}} .sl{opacity:0;animation:cyc 12s linear infinite both}
</style>
<rect x=".5" y=".5" width="899" height="249" rx="18" fill="#050a14" stroke="#18203a"/>
<g clip-path="url(#card)"><g stroke="#0e1730" stroke-width="1"><animateTransform attributeName="transform" type="translate" from="0 0" to="30 30" dur="6s" repeatCount="indefinite"/><path d="M-30 -30V280"/><path d="M0 -30V280"/><path d="M30 -30V280"/><path d="M60 -30V280"/><path d="M90 -30V280"/><path d="M120 -30V280"/><path d="M150 -30V280"/><path d="M180 -30V280"/><path d="M210 -30V280"/><path d="M240 -30V280"/><path d="M270 -30V280"/><path d="M300 -30V280"/><path d="M330 -30V280"/><path d="M360 -30V280"/><path d="M390 -30V280"/><path d="M420 -30V280"/><path d="M450 -30V280"/><path d="M480 -30V280"/><path d="M510 -30V280"/><path d="M540 -30V280"/><path d="M570 -30V280"/><path d="M600 -30V280"/><path d="M630 -30V280"/><path d="M660 -30V280"/><path d="M690 -30V280"/><path d="M720 -30V280"/><path d="M750 -30V280"/><path d="M780 -30V280"/><path d="M810 -30V280"/><path d="M840 -30V280"/><path d="M870 -30V280"/><path d="M900 -30V280"/><path d="M930 -30V280"/><path d="M-30 -30H930"/><path d="M-30 0H930"/><path d="M-30 30H930"/><path d="M-30 60H930"/><path d="M-30 90H930"/><path d="M-30 120H930"/><path d="M-30 150H930"/><path d="M-30 180H930"/><path d="M-30 210H930"/><path d="M-30 240H930"/><path d="M-30 270H930"/></g></g>
