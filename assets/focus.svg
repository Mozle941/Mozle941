<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" fill="none" role="img" aria-label="Focus: Python, TypeScript, C++">
<defs><clipPath id="card"><rect x="1" y="1" width="898" height="188" rx="18"/></clipPath></defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace} .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.lbl{font-size:10px;letter-spacing:2.5px;fill:#6f7fa6}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.fu{opacity:0;animation:fadeUp .8s ease-out forwards}
.sp{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.spr{transform-box:fill-box;transform-origin:center;animation:spinr 36s linear infinite}
.pl{animation:pulse 2.4s ease-in-out infinite}
.fl{stroke-dasharray:2 8;animation:flow 2s linear infinite}
.gr{transform-box:fill-box;transform-origin:left center;animation:grow 1.4s ease-out forwards}

</style>
<rect x=".5" y=".5" width="899" height="189" rx="18" fill="#050a14" stroke="#18203a"/>
<g clip-path="url(#card)"><g stroke="#0e1730" stroke-width="1"><animateTransform attributeName="transform" type="translate" from="0 0" to="30 30" dur="6s" repeatCount="indefinite"/><path d="M-30 -30V220"/><path d="M0 -30V220"/><path d="M30 -30V220"/><path d="M60 -30V220"/><path d="M90 -30V220"/><path d="M120 -30V220"/><path d="M150 -30V220"/><path d="M180 -30V220"/><path d="M210 -30V220"/><path d="M240 -30V220"/><path d="M270 -30V220"/><path d="M300 -30V220"/><path d="M330 -30V220"/><path d="M360 -30V220"/><path d="M390 -30V220"/><path d="M420 -30V220"/><path d="M450 -30V220"/><path d="M480 -30V220"/><path d="M510 -30V220"/><path d="M540 -30V220"/><path d="M570 -30V220"/><path d="M600 -30V220"/><path d="M630 -30V220"/><path d="M660 -30V220"/><path d="M690 -30V220"/><path d="M720 -30V220"/><path d="M750 -30V220"/><path d="M780 -30V220"/><path d="M810 -30V220"/><path d="M840 -30V220"/><path d="M870 -30V220"/><path d="M900 -30V220"/><path d="M930 -30V220"/><path d="M-30 -30H930"/><path d="M-30 0H930"/><path d="M-30 30H930"/><path d="M-30 60H930"/><path d="M-30 90H930"/><path d="M-30 120H930"/><path d="M-30 150H930"/><path d="M-30 180H930"/><path d="M-30 210H930"/></g></g>
<text class="lbl" x="40" y="38">FOCUS STACK</text>
<g class="fu" style="animation-delay:0.2s"><text x="40" y="86" font-size="30" font-weight="700" fill="#7aa2ff">01</text>
<path class="gr" d="M40 104H280" stroke="#4f7cff" stroke-opacity=".5" style="animation-delay:0.2s"/>
<text x="40" y="134" font-size="17" font-weight="700" fill="#e6edf3">Python</text><text x="40" y="156" font-size="11" fill="#6f7fa6">Primary language · 5 public repos</text></g>
<g class="fu" style="animation-delay:0.5s"><text x="320" y="86" font-size="30" font-weight="700" fill="#7aa2ff">02</text>
<path class="gr" d="M320 104H560" stroke="#4f7cff" stroke-opacity=".5" style="animation-delay:0.5s"/>
<text x="320" y="134" font-size="17" font-weight="700" fill="#e6edf3">TypeScript</text><text x="320" y="156" font-size="11" fill="#6f7fa6">1 public repo</text></g>
<g class="fu" style="animation-delay:0.8s"><text x="600" y="86" font-size="30" font-weight="700" fill="#7aa2ff">03</text>
<path class="gr" d="M600 104H840" stroke="#4f7cff" stroke-opacity=".5" style="animation-delay:0.8s"/>
<text x="600" y="134" font-size="17" font-weight="700" fill="#e6edf3">C++</text><text x="600" y="156" font-size="11" fill="#6f7fa6">1 public repo</text></g>
</svg>
