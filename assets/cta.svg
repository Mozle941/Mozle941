<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" fill="none" role="img" aria-label="Call to action: follow @Mozle941 on GitHub">
<defs><clipPath id="card"><rect x="1" y="1" width="898" height="228" rx="18"/></clipPath></defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace} .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.lbl{font-size:10px;letter-spacing:2.5px;fill:#6f7fa6}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.fu{opacity:0;animation:fadeUp .8s ease-out forwards}
.sp{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.spr{transform-box:fill-box;transform-origin:center;animation:spinr 36s linear infinite}
.pl{animation:pulse 2.4s ease-in-out infinite}
.fl{stroke-dasharray:2 8;animation:flow 2s linear infinite}
.gr{transform-box:fill-box;transform-origin:left center;animation:grow 1.4s ease-out forwards}

</style>
<rect x=".5" y=".5" width="899" height="229" rx="18" fill="#050a14" stroke="#18203a"/>
<g clip-path="url(#card)"><g stroke="#0e1730" stroke-width="1"><animateTransform attributeName="transform" type="translate" from="0 0" to="30 30" dur="6s" repeatCount="indefinite"/><path d="M-30 -30V260"/><path d="M0 -30V260"/><path d="M30 -30V260"/><path d="M60 -30V260"/><path d="M90 -30V260"/><path d="M120 -30V260"/><path d="M150 -30V260"/><path d="M180 -30V260"/><path d="M210 -30V260"/><path d="M240 -30V260"/><path d="M270 -30V260"/><path d="M300 -30V260"/><path d="M330 -30V260"/><path d="M360 -30V260"/><path d="M390 -30V260"/><path d="M420 -30V260"/><path d="M450 -30V260"/><path d="M480 -30V260"/><path d="M510 -30V260"/><path d="M540 -30V260"/><path d="M570 -30V260"/><path d="M600 -30V260"/><path d="M630 -30V260"/><path d="M660 -30V260"/><path d="M690 -30V260"/><path d="M720 -30V260"/><path d="M750 -30V260"/><path d="M780 -30V260"/><path d="M810 -30V260"/><path d="M840 -30V260"/><path d="M870 -30V260"/><path d="M900 -30V260"/><path d="M930 -30V260"/><path d="M-30 -30H930"/><path d="M-30 0H930"/><path d="M-30 30H930"/><path d="M-30 60H930"/><path d="M-30 90H930"/><path d="M-30 120H930"/><path d="M-30 150H930"/><path d="M-30 180H930"/><path d="M-30 210H930"/><path d="M-30 240H930"/></g></g>
<text x="40" y="50" font-size="22" font-weight="700" fill="#e6edf3">Build the next chapter</text><path d="M40 72H860" stroke="#4f7cff" stroke-opacity=".3" stroke-dasharray="2 6"/>
<g class="fu"><circle cx="52" cy="122" r="11" fill="#e6edf3"/><path d="M46 128c2 2 4 1 6 1s4 1 6-1M46 118l2 3m10-3l-2 3" stroke="#050a14" stroke-width="1.6" stroke-linecap="round"/>
<text class="lbl" x="74" y="125" font-size="8">GITHUB</text><text x="150" y="127" font-size="14" font-weight="700" fill="#e6edf3">@Mozle941</text></g>
<g class="fu" style="animation-delay:.4s"><rect x="40" y="156" width="150" height="34" rx="17" fill="#4f7cff"/><text x="115" y="178" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">FOLLOW →</text></g>
